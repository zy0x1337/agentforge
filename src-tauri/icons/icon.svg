<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- AgentForge icon — canonical SVG source
       Concept: stylised agent-node graph with an A-frame peak.
       Regenerate raster sizes with:
         npx @tauri-apps/cli icon src-tauri/icons/icon.svg
       or manually via Inkscape / sharp CLI (see icons/README.md).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a1918"/>
      <stop offset="100%" stop-color="#0e0d0c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4f98a3"/>
      <stop offset="100%" stop-color="#01696f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- ── Agent-node mark ─────────────────────────────────────────
       Three nodes connected in a downward-branching tree:
         top centre  → two children (left, right)
       With a subtle upward A-peak on the top node to echo the
       letter A and the concept of an "apex" agent.
  -->

  <!-- Connector lines (drawn behind nodes) -->
  <!-- top → bottom-left -->
  <line x1="128" y1="88" x2="82" y2="168"
        stroke="url(#mark)" stroke-width="10"
        stroke-linecap="round" opacity="0.7"/>
  <!-- top → bottom-right -->
  <line x1="128" y1="88" x2="174" y2="168"
        stroke="url(#mark)" stroke-width="10"
        stroke-linecap="round" opacity="0.7"/>

  <!-- Top (root) node -->
  <circle cx="128" cy="78" r="26" fill="url(#mark)"/>
  <!-- A-peak on top node: two short lines forming a caret -->
  <polyline points="114,78 128,58 142,78"
            fill="none" stroke="#0e0d0c"
            stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-left node -->
  <circle cx="82" cy="178" r="22" fill="url(#mark)" opacity="0.9"/>

  <!-- Bottom-right node -->
  <circle cx="174" cy="178" r="22" fill="url(#mark)" opacity="0.9"/>

  <!-- Inner dots (agent-active indicator) -->
  <circle cx="82"  cy="178" r="7" fill="#0e0d0c" opacity="0.6"/>
  <circle cx="174" cy="178" r="7" fill="#0e0d0c" opacity="0.6"/>
</svg>
