[package]
name = "agentforge"
version = "0.1.0"
description = "AgentForge - Local LLM Agent Workflow Runner"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "agentforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
