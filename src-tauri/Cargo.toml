[package]
name        = "agentforge"
version     = "0.1.0"
description = "Browse local LLMs and orchestrate Markdown-defined agent workflows"
authors     = ["AgentForge Contributors"]
repository  = "https://github.com/zy0x1337/agentforge"
homepage    = "https://github.com/zy0x1337/agentforge"
license     = "MIT"
edition     = "2021"
rust-version = "1.77"

[lib]
name       = "agentforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-fs    = "2"
tauri-plugin-shell = "2"
tauri-plugin-http  = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client used by download_gguf (sync, no extra async runtime needed).
ureq = { version = "3", features = ["json"] }

# SHA-256 verification for downloaded GGUF files.
sha2 = "0.10"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
