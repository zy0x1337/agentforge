# ───────────────────────────────────────────────────────────────────────────────
# Release — cross-platform build on v* tags
#
# Trigger:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Platforms:
#   Windows x64  — NSIS installer + MSI
#   macOS aarch64 (Apple Silicon) + x86_64 (Intel) — .dmg
#   Linux x64    — AppImage + .deb
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# ───────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────────
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            bundle_dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            artifact_glob: '*.exe *.msi'

          # ── macOS Apple Silicon ───────────────────────────────────────────────
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact_glob: '*.dmg'

          # ── macOS Intel ──────────────────────────────────────────────────────
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle
            artifact_glob: '*.dmg'

          # ── Linux ─────────────────────────────────────────────────────────────
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            bundle_dir: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
            artifact_glob: '*.AppImage *.deb'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux system dependencies ─────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: ${{ matrix.target }}

      - name: Generate icon raster files
        run: pnpm tauri icon src-tauri/icons/icon.svg

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing — set these secrets if you have an Apple Developer account
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentForge ${{ github.ref_name }}'
          releaseBody: |
            ## AgentForge ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Notes |
            |---|---|---|
            | Windows x64 | `AgentForge_*_x64-setup.exe` | NSIS installer — recommended |
            | Windows x64 | `AgentForge_*_x64.msi` | MSI — enterprise / GPO |
            | macOS Apple Silicon | `AgentForge_*_aarch64.dmg` | M1/M2/M3/M4 |
            | macOS Intel | `AgentForge_*_x64.dmg` | Intel Mac |
            | Linux x64 | `AgentForge_*_amd64.AppImage` | Universal, no install needed |
            | Linux x64 | `AgentForge_*_amd64.deb` | Debian / Ubuntu |

            ### Requirements
            - [Ollama](https://ollama.com) installed and running locally
            - At least one model pulled, e.g. `ollama pull llama3.2:3b`

            ### Checksums
            SHA-256 checksums are attached as `checksums-*.txt` per platform.

            ---
            **Full changelog:** https://github.com/zy0x1337/agentforge/commits/${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # ── Checksums (runs after all platform builds) ─────────────────────────────
  checksums:
    name: Generate combined checksums
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.ref_name }}
          fileName: '*'
          out-file-path: release-assets
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum *.exe *.msi *.dmg *.AppImage *.deb 2>/dev/null | tee ../checksums.txt || true
          cat ../checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
