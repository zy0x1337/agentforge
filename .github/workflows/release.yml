# ───────────────────────────────────────────────────────────────────────────────
# Release — build Windows installer + portable .exe on v* tags
#
# Trigger:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Artifacts published to GitHub Release:
#   AgentForge_0.2.0_x64-setup.exe    (NSIS installer)
#   AgentForge_0.2.0_x64_en-US.msi    (WiX MSI)
#   AgentForge_0.2.0_x64.nsis.zip     (portable, optional)
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY   — base64-encoded .p12 / PEM private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — passphrase (may be empty string)
#
# To generate a signing key pair (self-signed, for update signatures):
#   npx @tauri-apps/cli signer generate -w ~/.tauri/agentforge.key
#   Then base64-encode the .key file and store as the secret above.
# ───────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'   # v0.1.0, v1.2.3, etc.

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ── Source ────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / pnpm ───────────────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ───────────────────────────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ── Icon raster generation ───────────────────────────────────────────────────────────
      # Generate all PNG/ICO/ICNS from the canonical SVG.
      # This ensures every release build has up-to-date icons even if
      # contributors forgot to commit the regenerated PNGs.
      - name: Generate icon raster files
        run: pnpm tauri icon src-tauri/icons/icon.svg

      # ── Tauri build ───────────────────────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}        # e.g. v0.2.0
          releaseName: 'AgentForge ${{ github.ref_name }}'
          releaseBody: |
            ## AgentForge ${{ github.ref_name }}

            ### Installation
            1. Download `AgentForge_*_x64-setup.exe` below
            2. Run the installer (no admin required — installs to user profile)
            3. Make sure [Ollama](https://ollama.com) is installed and running

            ### What’s included
            - Windows NSIS installer (`.exe`) — recommended
            - Windows MSI installer (`.msi`) — for enterprise / GPO deployment

            ### Checksums
            SHA-256 checksums are attached as `checksums.txt`.

            ---
            **Full changelog:** https://github.com/zy0x1337/agentforge/commits/${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v0.2.0-beta.1 -> prerelease
          args: --target x86_64-pc-windows-msvc

      # ── Checksums ───────────────────────────────────────────────────────────────────
      - name: Generate checksums
        shell: pwsh
        run: |
          $outDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $files  = Get-ChildItem -Path $outDir -Recurse -Include "*.exe","*.msi" | Where-Object { $_.Name -notlike "*debug*" }
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content checksums.txt
          Write-Output "Generated checksums.txt:"
          Get-Content checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
