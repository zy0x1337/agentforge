# ───────────────────────────────────────────────────────────────────────────────
# Release — build Windows installer + portable .exe on v* tags
#
# Trigger:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# ───────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build — Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Generate icon raster files
        run: pnpm tauri icon src-tauri/icons/icon.svg

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentForge ${{ github.ref_name }}'
          releaseBody: |
            ## AgentForge ${{ github.ref_name }}

            ### Installation
            1. Download `AgentForge_*_x64-setup.exe` below
            2. Run the installer (no admin required — installs to user profile)
            3. Make sure [Ollama](https://ollama.com) is installed and running

            ### What’s included
            - Windows NSIS installer (`.exe`) — recommended
            - Windows MSI installer (`.msi`) — for enterprise / GPO deployment

            ### Checksums
            SHA-256 checksums are attached as `checksums.txt`.

            ---
            **Full changelog:** https://github.com/zy0x1337/agentforge/commits/${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-pc-windows-msvc

      - name: Generate checksums
        shell: pwsh
        run: |
          $outDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $files  = Get-ChildItem -Path $outDir -Recurse -Include "*.exe","*.msi" | Where-Object { $_.Name -notlike "*debug*" }
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content checksums.txt
          Get-Content checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
